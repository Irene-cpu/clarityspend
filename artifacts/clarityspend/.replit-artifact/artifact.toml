kind = "web"
previewPath = "/"
title = "ClaritySpend"
version = "1.0.0"
id = "artifacts/clarityspend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22140
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/clarityspend run dev"

[services.env]
PORT = "22140"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/clarityspend", "run", "build"]
publicDir = "artifacts/clarityspend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
